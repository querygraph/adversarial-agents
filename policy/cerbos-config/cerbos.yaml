# Cerbos server config for the AgentGym competitor mode. HTTP on 3592,
# policies loaded from the mounted disk store. Audit is on so each decision
# carries a cerbosCallId the benchmark records as evidence.
server:
  httpListenAddr: "0.0.0.0:3592"
  grpcListenAddr: "0.0.0.0:3593"

storage:
  driver: "disk"
  disk:
    directory: /policies
    watchForChanges: false

audit:
  enabled: true
  backend: local
  local:
    storagePath: /tmp/cerbos/audit.log

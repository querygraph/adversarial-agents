# catalog/query — the governed catalog read. Cerbos can enforce every
# constraint that rides in the dispatch-time request: exact resource, ODRL
# purpose, the allowed-column set, and the approved row predicate. These
# constants are hand-translated from fixtures/world.json + policy/odrl.json;
# tests/test_engines.py asserts they still match, since a hand-translated
# policy that silently drifts from the source is exactly the BG-13 failure.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: dataset
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.id == "lakecat://northstar/household_energy"
              - expr: request.resource.attr.purpose == "energy-assistance-research"
              - expr: has(request.resource.attr.args.columns)
              - expr: size(request.resource.attr.args.columns) > 0
              - expr: >
                  request.resource.attr.args.columns.all(c,
                    c in ["region", "energy_source", "monthly_energy_cost"])
              - expr: request.resource.attr.args.predicate == "cohort = 'approved'"

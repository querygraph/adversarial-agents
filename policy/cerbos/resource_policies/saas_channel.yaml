# drive/create, gmail/send — delegated SaaS execution. Cerbos binds the
# delegated user to the authenticated principal (BG-05 attack, executing
# under Leo, is denied) and enforces the Gmail purpose. It cannot see the
# data-plane content label, so BG-06's sensitive-content attack — a request
# byte-identical to the benign send — is allowed here: the information-flow
# invariant is not expressible at a request-only decision point.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: saas_channel
  rules:
    - actions: ["execute"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.delegated_user == request.principal.id
              - expr: >
                  request.resource.attr.tool != "gmail/send" ||
                  request.resource.attr.purpose == "approved-communication"

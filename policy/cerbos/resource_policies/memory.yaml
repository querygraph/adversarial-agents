# memory/recall — durable identity is in the request, so Cerbos denies the
# outsider's recall (BG-08 attack). The stored sensitivity label is
# execution-plane state Cerbos never sees, but the identity binding alone
# defeats this attack.
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: memory
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.id == "agent:research-supervisor"
              - expr: request.resource.id == "memory/study-finding"

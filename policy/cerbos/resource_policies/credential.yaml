# credential/vend — raw flag, scope, and TTL are all request fields, so
# Cerbos denies the raw wildcard hour-long credential (BG-11 attack).
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: credential
  rules:
    - actions: ["read"]
      effect: EFFECT_ALLOW
      roles: ["user"]
      condition:
        match:
          all:
            of:
              - expr: request.resource.attr.args.raw == false
              - expr: request.resource.attr.args.scope == "northstar/study/*"
              - expr: request.resource.attr.args.ttl <= 60

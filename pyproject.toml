[project]
name = "agentgym"
version = "0.3.0"
description = "Deterministic adversarial benchmark for agent security boundaries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typesec",
]

[project.optional-dependencies]
frameworks = [
    "crewai>=1.15,<2",
    "langchain>=1.3,<2",
    "langgraph>=1.2,<2",
    "pydantic-ai-slim>=2.31,<3",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pyyaml>=6",
]

[project.scripts]
agentgym = "agentgym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv.sources]
typesec = { path = "../typesec/crates/typesec-python", editable = true }

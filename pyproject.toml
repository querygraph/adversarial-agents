[project]
name = "agentgym"
version = "0.2.0"
description = "Deterministic adversarial benchmark for agent security boundaries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "typesec",
]

[project.optional-dependencies]
frameworks = [
    "crewai>=1.0",
    "langchain>=1.0",
    "langgraph>=1.0",
    "pydantic-ai-slim>=1.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=1",
]

[project.scripts]
agentgym = "agentgym.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
typesec = { path = "../typesec/crates/typesec-python", editable = true }

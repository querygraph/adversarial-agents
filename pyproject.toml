[project]
name = "querygraph-agentgym"
version = "0.3.0"
description = "Deterministic adversarial benchmark for agent security boundaries"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai==1.15.16",
    "langchain==1.3.15",
    "langgraph==1.2.11",
    "pydantic-ai-slim==2.31.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# The Rust substrate is a companion wheel built from this repository. It is
# intentionally not a base dependency, so the portable benchmark/reporting
# package remains installable without a Rust toolchain.
typesec = [
    "querygraph-agentgym-native==0.3.0",
]
test = [
    "hatchling==1.32.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[project.scripts]
agentgym = "agentgym.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentgym"]

# The repository copies are canonical for OPA/Cerbos volume mounts. Hatch
# installs those exact bytes below the Python package so wheels do not depend
# on a sibling source checkout at runtime.
[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "agentgym/resources/fixtures"
"policy" = "agentgym/resources/policy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv.sources]
querygraph-agentgym-native = { path = "native", editable = true }
